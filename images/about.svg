<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="presentation">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset="1" stop-color="#E4E0D8"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="750" fill="url(#wash)"/>
  <rect width="1000" height="750" fill="url(#light)"/>
  <g fill="#A38F7A" opacity="0.16">
    <circle cx="740" cy="225" r="195"/>
  </g>
  <g stroke="#A38F7A" stroke-width="1" opacity="0.28">
    <line x1="0" y1="510" x2="1000" y2="510"/>
    <line x1="160" y1="0" x2="160" y2="750"/>
  </g>
  <rect width="1000" height="750" filter="url(#grain)" opacity="0.05"/>
</svg>
