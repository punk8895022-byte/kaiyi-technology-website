<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="presentation">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEFE9"/>
      <stop offset="1" stop-color="#D8CDBD"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#wash)"/>
  <rect width="1000" height="700" fill="url(#light)"/>
  <g fill="#7E8C75" opacity="0.16">
    <circle cx="740" cy="210" r="182"/>
  </g>
  <g stroke="#7E8C75" stroke-width="1" opacity="0.28">
    <line x1="0" y1="476" x2="1000" y2="476"/>
    <line x1="160" y1="0" x2="160" y2="700"/>
  </g>
  <rect width="1000" height="700" filter="url(#grain)" opacity="0.05"/>
</svg>
