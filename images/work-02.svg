<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="presentation">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EEE7"/>
      <stop offset="1" stop-color="#A38F7A"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#wash)"/>
  <rect width="900" height="600" fill="url(#light)"/>
  <g fill="#D8CDBD" opacity="0.16">
    <circle cx="666" cy="180" r="156"/>
  </g>
  <g stroke="#D8CDBD" stroke-width="1" opacity="0.28">
    <line x1="0" y1="408" x2="900" y2="408"/>
    <line x1="144" y1="0" x2="144" y2="600"/>
  </g>
  <rect width="900" height="600" filter="url(#grain)" opacity="0.05"/>
</svg>
