      <stop offset="0" stop-color="#EFECE5"/>
      <stop offset="1" stop-color="#C9C4B6"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
